version: "2"

linters:
  default: none

  enable:
    - asciicheck
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - staticcheck
    - unconvert
    - unused

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    exhaustive:
      default-signifies-exhaustive: false

    gocritic:
      enabled-tags:
        - diagnostic
        - performance

    misspell:
      locale: US

    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: strict

    presets:
      - comments
      - common-false-positives
      - std-error-handling

    paths:
      - bin/
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gci
    - gofumpt

  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
      custom-order: true

    gofumpt:
      module-path: github.com/arxbombus/jominia
      extra-rules: true

  exclusions:
    generated: strict

    paths:
      - bin/
      - third_party$
      - builtin$
      - examples$
